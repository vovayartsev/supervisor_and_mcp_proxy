[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supervisor-and-mcp-proxy"
version = "0.1.0"
description = "Unified MCP HTTP endpoint that proxies stdio MCP servers and supervises local processes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vovayartsev" }]
dependencies = [
  "mcp>=1.2.0",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "pydantic>=2.6",
  "anyio>=4.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
supervisor-and-mcp-proxy = "mcp_supervisord.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_supervisord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
